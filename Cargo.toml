[package]
name = "nebula-player"
version = "0.1.0-alpha.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Nebula Player: a fast, native Jellyfin and local video player built on libcosmic and mpv"
repository = "https://github.com/NotTimm/NebulaPlayer"

[dependencies]
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
# libmpv is loaded at run time (src/mpv.rs), not linked.
libloading = "0.8"

# The owner's fork of pop-os/libcosmic, the same one Nebula Reader uses and
# pinned to the same commit (its patches are listed in NebulaReader's
# Cargo.toml). Kept in sync with upstream by merging; see docs/DEVELOPING.md.
[dependencies.libcosmic]
git = "https://github.com/NotTimm/libcosmic.git"
rev = "cd86f68873413a5340345a17fe8517f51a134d5d"
default-features = false
features = ["wgpu", "winit", "tokio", "multi-window"]

# Linux gets Wayland, COSMIC's settings daemon and XDG portal dialogs;
# Windows/macOS use plain winit windows and native (rfd) file dialogs.
# Same git/rev as above, so cargo merges these into one libcosmic.
[target.'cfg(target_os = "linux")'.dependencies]
libcosmic = { git = "https://github.com/NotTimm/libcosmic.git", rev = "cd86f68873413a5340345a17fe8517f51a134d5d", default-features = false, features = ["dbus-config", "wayland", "xdg-portal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
libcosmic = { git = "https://github.com/NotTimm/libcosmic.git", rev = "cd86f68873413a5340345a17fe8517f51a134d5d", default-features = false, features = ["rfd"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon and version info in the .exe (see build.rs).
winresource = "0.1"

[profile.release]
lto = true

# Poster and backdrop decoding is far slower unoptimised.
[profile.dev.package]
zune-jpeg.opt-level = 3
png.opt-level = 3
image-webp.opt-level = 3
image.opt-level = 3

# `cargo deb` (Debian/Ubuntu). libmpv is loaded at run time, so it's
# declared here rather than found by linking.
[package.metadata.deb]
name = "nebula-player"
maintainer = "Tim Singel <gamer.tdogtim@gmail.com>"
section = "video"
depends = "$auto, libmpv2 | libmpv1"
extended-description = "A fast, native Jellyfin and local video player built on libcosmic and mpv."
assets = [
    ["target/release/nebula-player", "usr/bin/", "755"],
    ["res/io.github.NotTimm.NebulaPlayer.desktop", "usr/share/applications/", "644"],
    ["res/io.github.NotTimm.NebulaPlayer.metainfo.xml", "usr/share/metainfo/", "644"],
    ["res/io.github.NotTimm.NebulaPlayer.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/nebula-player/", "644"],
]

# `cargo generate-rpm` (Fedora).
[package.metadata.generate-rpm]
name = "nebula-player"
summary = "Native Jellyfin and local video player"
assets = [
    { source = "target/release/nebula-player", dest = "/usr/bin/nebula-player", mode = "755" },
    { source = "res/io.github.NotTimm.NebulaPlayer.desktop", dest = "/usr/share/applications/io.github.NotTimm.NebulaPlayer.desktop", mode = "644" },
    { source = "res/io.github.NotTimm.NebulaPlayer.metainfo.xml", dest = "/usr/share/metainfo/io.github.NotTimm.NebulaPlayer.metainfo.xml", mode = "644" },
    { source = "res/io.github.NotTimm.NebulaPlayer.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.NotTimm.NebulaPlayer.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/nebula-player/README.md", mode = "644", doc = true },
]
auto-req = "auto"

[package.metadata.generate-rpm.requires]
mpv-libs = "*"
