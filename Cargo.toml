[package]
name = "nebula-player"
version = "0.1.0-alpha.5"
edition = "2021"
license = "GPL-3.0-only"
description = "Nebula Player: a fast, native Jellyfin and local video player built on libcosmic and mpv"
repository = "https://github.com/NotTimm/NebulaPlayer"

[dependencies]
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "blocking"] }
# The session's WebSocket, for SyncPlay (src/syncplay.rs).
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
# libmpv is loaded at run time (src/mpv.rs), not linked.
libloading = "0.9"
# In-app updates (src/updater.rs): signature checks and the Windows zip.
minisign-verify = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

# The owner's fork of pop-os/libcosmic, the same one Nebula Reader uses and
# pinned to the same commit (its patches are listed in NebulaReader's
# Cargo.toml). Kept in sync with upstream by merging; see docs/DEVELOPING.md.
[dependencies.libcosmic]
git = "https://github.com/NotTimm/libcosmic.git"
rev = "cd86f68873413a5340345a17fe8517f51a134d5d"
default-features = false
features = ["wgpu", "winit", "tokio", "multi-window"]

# Linux gets Wayland, COSMIC's settings daemon and XDG portal dialogs;
# Windows/macOS use plain winit windows and native (rfd) file dialogs.
# Same git/rev as above, so cargo merges these into one libcosmic.
[target.'cfg(target_os = "linux")'.dependencies]
libcosmic = { git = "https://github.com/NotTimm/libcosmic.git", rev = "cd86f68873413a5340345a17fe8517f51a134d5d", default-features = false, features = ["dbus-config", "wayland", "xdg-portal"] }
# The desktop's accent colour (XDG settings portal); libcosmic's own copy.
ashpd = { version = "0.12.3", default-features = false, features = ["tokio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
libcosmic = { git = "https://github.com/NotTimm/libcosmic.git", rev = "cd86f68873413a5340345a17fe8517f51a134d5d", default-features = false, features = ["rfd"] }

[target.'cfg(windows)'.dependencies]
# The title bar's icon and colours (src/app/window_frame.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Signs test files for the updater's tests.
minisign = "0.10.0"

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon and version info in the .exe (see build.rs).
winresource = "0.1"

[profile.release]
lto = true

# Poster and backdrop decoding is far slower unoptimised.
[profile.dev.package]
zune-jpeg.opt-level = 3
png.opt-level = 3
image-webp.opt-level = 3
image.opt-level = 3
