# Builds and tests Nebula Player for Linux (.deb, .rpm, .tar.gz) and
# Windows (.zip) on every push to main, keeping the files as downloadable
# test builds (Actions → the run → Artifacts).
#
# Run it by hand (Actions → Build → Run workflow) with "publish" ticked to
# also create the GitHub release v<version from Cargo.toml>, marked as a
# pre-release. Publishing refuses to run unless the version is an alpha,
# beta or rc and packaging/release-notes/<version>.md exists.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub pre-release v<version> with these builds"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # libmpv for the Windows zip: one exact build, checked by hash, so a new
  # upload can't change what ships. Newer builds:
  # https://sourceforge.net/projects/mpv-player-windows/files/libmpv/
  MPV_DEV_FILE: mpv-dev-x86_64-20261018-git-01e2533f31.7z
  MPV_DEV_SHA256: d7f5621f42b6e161fe032df914a10bdece28a89df3e57c6c3e16a5a250929b5e

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
      - name: Check it can be published
        if: inputs.publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$VERSION" in
            *-alpha*|*-beta*|*-rc*) ;;
            *) echo "::error::$VERSION isn't an alpha, beta or rc; releases stay pre-releases for now."; exit 1 ;;
          esac
          notes="packaging/release-notes/$VERSION.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing: write the release notes first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already released: bump the version in Cargo.toml."
            exit 1
          fi

  linux:
    name: Linux
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libssl-dev desktop-file-utils appstream
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the desktop entry and AppStream metadata
        run: |
          desktop-file-validate res/io.github.NotTimm.NebulaPlayer.desktop
          appstreamcli validate --no-net res/io.github.NotTimm.NebulaPlayer.metainfo.xml
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Install packagers
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Package
        run: |
          mkdir -p dist
          cargo deb --no-build --output dist/
          # RPM versions can't hold '-': 0.1.0-alpha.1 becomes 0.1.0~alpha.1,
          # which also sorts before the final 0.1.0.
          cargo generate-rpm --output dist/ --set-metadata "version = \"${VERSION//-/\~}\""
          tarball="nebula-player-$VERSION-linux-x86_64"
          mkdir -p "$tarball"
          cp target/release/nebula-player README.md LICENSE "$tarball/"
          cp res/io.github.NotTimm.NebulaPlayer.desktop res/io.github.NotTimm.NebulaPlayer.svg \
            res/io.github.NotTimm.NebulaPlayer.metainfo.xml "$tarball/"
          tar -czf "dist/$tarball.tar.gz" "$tarball"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Get libmpv
        shell: pwsh
        run: |
          $url = "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/$env:MPV_DEV_FILE/download"
          curl.exe -fsSL --retry 5 -o mpv-dev.7z $url
          $hash = (Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MPV_DEV_SHA256) { throw "libmpv download has hash $hash, expected $env:MPV_DEV_SHA256" }
          7z x mpv-dev.7z -ompv-dev libmpv-2.dll
          if (-not (Test-Path mpv-dev/libmpv-2.dll)) { throw "libmpv-2.dll not in the download" }
      - name: Package
        shell: pwsh
        run: |
          $name = "nebula-player-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $name, dist | Out-Null
          Copy-Item target/release/nebula-player.exe, mpv-dev/libmpv-2.dll, README.md, LICENSE -Destination $name
          Compress-Archive -Path "$name/*" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish pre-release
    needs: [version, linux, windows]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        run: |
          ls -la dist
          gh release create "v$VERSION" dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nebula Player $VERSION" \
            --notes-file "packaging/release-notes/$VERSION.md"
