# Builds every package: .deb (Ubuntu 24.04), .rpm (Fedora), AppImage,
# .flatpak bundle, for Windows a portable .zip and a setup .exe, and for
# Apple Silicon Macs a .dmg; plus the crates vendored for the Fedora spec
# (packaging/fedora/), which the `fedora` job test-builds the way COPR
# will. Each job runs a script from packaging/, then installs or runs what
# it built and checks it finds mpv (`nebula-player --check-mpv`).
#
# - Pushes to main, pull requests and manual runs: build them all and keep
#   them as workflow artifacts for 14 days (the run's summary page).
# - A manual run with "publish" ticked (or pushing a tag v<version>):
#   same, then create the GitHub pre-release v<Cargo.toml version> with
#   every package. Publishing refuses a version that isn't an alpha, beta
#   or rc, one already released, and one without
#   packaging/release-notes/<version>.md.
# - Packages are signed with minisign (the MINISIGN_KEY and
#   MINISIGN_PASSWORD secrets, the same key as Nebula Reader's) and
#   published with their `<name>.minisig`. Without the secrets the builds
#   are unsigned, with a warning.
#
# - After publishing, the `copr` job starts the COPR build of the new
#   release (secret COPR_CONFIG: the config block from
#   copr.fedorainfracloud.org/api, which expires every 180 days). The
#   project is the COPR_PROJECT repository variable, by default
#   timbo-slice/nebula-player. Without the secret it only warns.
#
# Besides those, only the default GITHUB_TOKEN is needed (contents:
# write, for the release).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub pre-release v<Cargo.toml version> from this commit"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_FLAGS: --locked
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Read the version from Cargo.toml
        run: |
          version="$(bash -c 'source packaging/common.sh && version')"
          if [ -z "$version" ]; then
            echo "::error::could not read the version from Cargo.toml"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check the Fedora spec's version
        run: |
          spec="$(sed -n 's/^Version: *//p' packaging/fedora/nebula-player.spec)"
          native="$(bash -c 'source packaging/common.sh && version_native')"
          if [ "$spec" != "$native" ]; then
            echo "::error::packaging/fedora/nebula-player.spec says Version $spec, Cargo.toml $native"; exit 1
          fi

      - name: Check a tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml's version (expected v$VERSION)"; exit 1
          fi

      - name: Check it can be published
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          case "$VERSION" in
            *-alpha*|*-beta*|*-rc*) ;;
            *) echo "::error::$VERSION isn't an alpha, beta or rc; releases stay pre-releases for now."; exit 1 ;;
          esac
          notes="packaging/release-notes/$VERSION.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing: write the release notes first."; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != tag ] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already released: bump the version in Cargo.toml."; exit 1
          fi

  test:
    name: Tests and checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev libwayland-dev libssl-dev \
            desktop-file-utils appstream shellcheck

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Check the desktop entry, AppStream metadata and scripts
        run: |
          desktop-file-validate res/io.github.NotTimm.NebulaPlayer.desktop
          appstreamcli validate --no-net res/io.github.NotTimm.NebulaPlayer.metainfo.xml
          shellcheck -x -P packaging packaging/*.sh packaging/fedora/*.sh

      - name: Run tests
        run: cargo test --locked

  deb:
    name: .deb (Ubuntu 24.04)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev libxkbcommon-dev libwayland-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: deb

      - name: Build the package
        run: bash packaging/build-deb.sh

      # Installing pulls in libmpv2 through the package's Depends.
      - name: Inspect and install it
        run: |
          for f in dist/*.deb; do
            dpkg-deb --info "$f"
            dpkg-deb --contents "$f"
          done
          sudo apt-get install -y ./dist/*.deb
          nebula-player --version
          nebula-player --check-mpv

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-player-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  rpm:
    name: .rpm (Fedora)
    needs: version
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      # git first so actions/checkout makes a real clone (and the rpm
      # changelog can record the commit); tar/zstd for the cargo cache.
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git tar zstd gcc gcc-c++ make pkgconf-pkg-config rpm-build \
            libxkbcommon-devel wayland-devel openssl-devel

      - uses: actions/checkout@v4

      - name: Mark the checkout as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rpm-fedora

      - name: Build the package
        run: bash packaging/build-rpm.sh

      # Installing pulls in mpv-libs through the package's Requires.
      - name: Inspect and install it
        run: |
          for f in dist/*.rpm; do
            rpm -qip "$f"
            rpm -qlp "$f"
            echo "--- Requires:"
            rpm -qRp "$f"
          done
          dnf install -y ./dist/*.rpm
          nebula-player --version
          nebula-player --check-mpv

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-player-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  appimage:
    name: AppImage
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # libmpv2 is what gets bundled.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl libxkbcommon-dev libwayland-dev libssl-dev libmpv2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: appimage

      - name: Build the AppImage
        run: bash packaging/build-appimage.sh

      # Without the system's libmpv, the AppImage must still find its own.
      - name: Run it without a system libmpv
        run: |
          sudo apt-get remove -y libmpv2
          for f in dist/NebulaPlayer-*.AppImage; do
            chmod +x "$f"
            APPIMAGE_EXTRACT_AND_RUN=1 "$f" --check-mpv
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-player-appimage
          path: dist/NebulaPlayer-*.AppImage
          if-no-files-found: error
          retention-days: 14

  # The Flatpak builds offline, so every crate is listed up front from
  # Cargo.lock. Done here because the Flatpak builder image has no
  # package manager to install the generator's Python dependencies.
  cargo-sources:
    name: cargo-sources.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate
        run: |
          pip install aiohttp tomlkit pyyaml
          bash packaging/gen-cargo-sources.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-sources
          path: packaging/cargo-sources.json
          if-no-files-found: error
          retention-days: 14

  flatpak:
    name: .flatpak
    needs: [version, cargo-sources]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cargo-sources
          path: packaging

      # The manifest's GNOME runtime and SDK come from Flathub.
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: NebulaPlayer-${{ needs.version.outputs.version }}-x86_64.flatpak
          manifest-path: packaging/io.github.NotTimm.NebulaPlayer.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'packaging/io.github.NotTimm.NebulaPlayer.yml') }}
          upload-artifact: false

      # Runs the installed bundle inside this container; a hiccup of the
      # container's Flatpak setup shouldn't hold back a bundle that built,
      # so a failure here is reported but doesn't fail the build.
      - name: Check the bundled libmpv loads
        continue-on-error: true
        run: |
          flatpak install --user -y --noninteractive "NebulaPlayer-${{ needs.version.outputs.version }}-x86_64.flatpak"
          flatpak run --command=nebula-player io.github.NotTimm.NebulaPlayer --check-mpv

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-player-flatpak
          path: NebulaPlayer-*.flatpak
          if-no-files-found: error
          retention-days: 14

  vendor:
    name: Vendored crates (Fedora/COPR)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Vendor
        run: bash packaging/fedora/make-vendor.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-player-vendor
          path: dist/*-vendor.tar.xz
          if-no-files-found: error
          retention-days: 14

  # Builds packaging/fedora/nebula-player.spec the way COPR or Fedora
  # would: offline, from a source tarball and the vendor tarball. Its rpm
  # isn't published (the GitHub .rpm comes from the rpm job).
  fedora:
    name: Fedora spec (as COPR builds it)
    needs: vendor
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False git tar rpm-build dnf-plugins-core

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nebula-player-vendor
          path: rpmbuild/SOURCES

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          spec=packaging/fedora/nebula-player.spec
          v="$(rpmspec -q --srpm --qf '%{version}' "$spec" | tr '~' '-')"
          git archive --prefix="NebulaPlayer-$v/" -o "rpmbuild/SOURCES/NebulaPlayer-$v.tar.gz" HEAD
          dnf builddep -y "$spec"
          rpmbuild --define "_topdir $PWD/rpmbuild" -ba "$spec"

      - name: Install it
        run: |
          dnf install -y rpmbuild/RPMS/*/nebula-player-[0-9]*.rpm
          nebula-player --check-mpv

  windows:
    name: Windows .zip and setup
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup (for the installer)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Run tests
        shell: pwsh
        run: cargo test --release --locked

      # Builds the zip and the installer; checks the exe loads libmpv-2.dll.
      - name: Build the packages
        shell: pwsh
        env:
          REQUIRE_INSTALLER: "1"
        run: ./packaging/build-windows.ps1

      # The installer installs silently, the Start menu entry points at the
      # exe, the installed exe finds libmpv-2.dll, and it uninstalls cleanly.
      - name: Test install and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Nebula Player"
          $exe = "$dir\nebula-player.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          if (-not (Test-Path "$dir\libmpv-2.dll")) { throw 'libmpv-2.dll missing' }
          Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter 'Nebula Player.lnk' | Out-Host
          $check = Start-Process $exe -ArgumentList '--check-mpv' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "the installed app's --check-mpv exited with $($check.ExitCode)" }
          $un = Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
          Start-Process $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          # The uninstaller re-launches itself from %TEMP%, so -Wait returns early.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw 'uninstall left the exe behind' }

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-player-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS .dmg (Apple Silicon)
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install mpv dylibbundler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Run tests
        run: cargo test --release --locked

      # Builds the app with Homebrew's mpv inside, and checks it runs.
      - name: Build the package
        run: bash packaging/build-macos.sh

      # The app on the disk image finds its own mpv, with Homebrew's gone.
      - name: Check the disk image's mpv
        run: |
          brew uninstall --ignore-dependencies mpv
          dmg="$(ls dist/*.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          "$mnt/Nebula Player.app/Contents/MacOS/nebula-player" --check-mpv
          hdiutil detach "$mnt"

      # Opens the app from the disk image (as a user would) and checks it
      # is still running a few seconds later. CI Macs are VMs without a
      # real GPU, so a failure here is reported but doesn't fail the build.
      - name: Smoke test
        continue-on-error: true
        run: |
          dmg="$(ls dist/*.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          "$mnt/Nebula Player.app/Contents/MacOS/nebula-player" > app.log 2>&1 &
          pid=$!
          sleep 10
          alive=0; kill -0 "$pid" 2>/dev/null && alive=1
          kill "$pid" 2>/dev/null || true
          sleep 1
          hdiutil detach "$mnt" || true
          cat app.log
          [ "$alive" = 1 ] || { echo "::warning::the app exited within 10 seconds"; exit 1; }

      # What the in-app updater (src/updater.rs) unpacks: the app must come
      # out of it intact, still signed, with no ._ metadata files.
      - name: Check the update package
        run: |
          d="$(mktemp -d)"
          tar -xzf dist/*.app.tar.gz -C "$d"
          ls -la "$d"
          [ "$(ls -A "$d")" = "Nebula Player.app" ] || { echo "unexpected contents"; exit 1; }
          codesign --verify --strict --verbose=2 "$d/Nebula Player.app"
          test -x "$d/Nebula Player.app/Contents/MacOS/nebula-player"

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-player-macos
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign packages
    needs: [deb, rpm, appimage, flatpak, windows, macos, vendor]
    runs-on: ubuntu-24.04
    steps:
      # Only for the public key the signatures are checked against.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/minisign.pub
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: nebula-player-*
          path: dist
          merge-multiple: true

      # Signs each package as `<name>.minisig` with the trusted comment
      # `file:<name>`, then checks every signature against
      # packaging/minisign.pub, so a wrong secret fails here.
      - name: Sign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::warning::the MINISIGN_KEY secret isn't set; packages are not signed"
            exit 0
          fi
          sudo apt-get install -y -q minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077; printf '%s\n' "$MINISIGN_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          public="$(tail -n 1 packaging/minisign.pub)"
          cd dist
          shopt -s nullglob
          files=(*.deb *.rpm *.AppImage *.flatpak *.zip *-setup.exe *.dmg *.app.tar.gz *-vendor.tar.xz)
          [ "${#files[@]}" -gt 0 ] || { echo "nothing to sign"; exit 1; }
          for f in "${files[@]}"; do
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$f" -t "file:$f" > /dev/null
            minisign -V -P "$public" -m "$f" -q
            echo "signed $f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-player-signatures
          path: dist/*.minisig
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [version, test, deb, rpm, appimage, flatpak, windows, macos, vendor, fedora, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/release-notes

      - uses: actions/download-artifact@v4
        with:
          pattern: nebula-player-*
          path: dist
          merge-multiple: true

      - run: ls -l dist

      # Every kind of package must be there; then everything in dist/ (with
      # the signatures, when signed) goes on the release. Creates it, or
      # on a re-run (or a release drafted by hand first) replaces its files.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          for kind in '*.deb' '*.rpm' '*.AppImage' '*.flatpak' '*.zip' '*-setup.exe' '*.dmg' '*.app.tar.gz' '*-vendor.tar.xz'; do
            # shellcheck disable=SC2206  # the glob is meant to expand
            found=(dist/$kind)
            [ "${#found[@]}" -gt 0 ] || { echo "::error::no $kind in dist"; exit 1; }
          done
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Nebula Player $VERSION" \
              --notes-file "packaging/release-notes/$VERSION.md" \
              --generate-notes
          fi

  copr:
    name: Build on COPR
    needs: [version, release]
    runs-on: ubuntu-24.04
    env:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
      COPR_PROJECT: ${{ vars.COPR_PROJECT || 'timbo-slice/nebula-player' }}
    steps:
      - name: Skip (no COPR_CONFIG secret)
        if: env.COPR_CONFIG == ''
        run: echo "::warning::COPR_CONFIG isn't set; start the COPR build by hand."

      - name: Start the build
        if: env.COPR_CONFIG != ''
        run: |
          pipx install copr-cli
          mkdir -p ~/.config
          (umask 077; printf '%s\n' "$COPR_CONFIG" > ~/.config/copr)
          trap 'rm -f ~/.config/copr' EXIT
          copr-cli build-package "$COPR_PROJECT" --name nebula-player --nowait
